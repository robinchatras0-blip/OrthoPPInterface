pipeline:
  run_name: run_server_a30_deep_search
  runs_dir: runs
  input_pdb: data/inputs/complex_S1_S2.pdb
  input_msa_A: data/inputs/S1_chain_A.a3m
  input_msa_B: data/inputs/S2_chain_B.a3m
  chain_A: A
  chain_B: B

  # Exploration étendue amont (Module 2) : 500 backbones de rupture
  foundry_n_batches: 500
  foundry_diffusion_batch_size: 1

  # Sauvetage RFD3 (Module 4) : 25 diffusions partielles par motif A' retenu
  rescue_diffusion_n_batches: 25
  rescue_ppi_hotspots: 8
  rupture_min_fixed_segment: 3
  rescue_min_fixed_segment: 3
  rescue_partial_t: 3.5
  max_rescue_scaffolds: 4
  include_native_scaffold: true       # true = inclut aussi le squelette WT natif comme témoin
  scaffold_max_clashes: 15
  scaffold_max_framework_rmsd: 1.5
  scaffold_min_flex_rmsd: 0.5
  scaffold_max_flex_rmsd: 4.5

  # Wrappers d'exécution robustes
  local_rfdiffusion: bash pipeline/bin/rfd3
  local_ligandmpnn: bash pipeline/bin/mpnn

diversity_selection:
  enabled: true
  # Conserver 10 motifs A' diversifiés (au lieu de 4) pour le sauvetage
  max_a_prime_motifs: 10

ligandmpnn:
  # Chemin vers le checkpoint LigandMPNN (adapter <user> ou le chemin exact)
  checkpoint_path: /home/friend/.foundry/checkpoints/ligandmpnn_v_32_010_25.pt
  model_type: ligand_mpnn
  is_legacy_weights: 'True'
  temperature_rupture: 0.2
  temperature_rescue: 0.15
  rescue_coadaptation: true
  rupture_apo_design: true            # A' designé seul pour empêcher l'optimisation contre B_WT
  samples_per_scaffold: 60            # 60 séquences MPNN par scaffold
  top_k_per_motif: 4                  # 4 designs B' retenus par motif A' (10 motifs * 4 = 40 complexes finaux)
  max_clashes_with_a_prime: 3
  ban_cysteines: true
  omit_AAs: "C"

folding:
  # Binaire RF3 et checkpoint (adapter <user> ou utiliser 'rf3' si dans le PATH)
  rf3_bin: /home/friend/miniforge3/envs/orthoppinterface/bin/rf3
  rf3_ckpt: /home/friend/.foundry/checkpoints/rf3_foundry_01_24_latest.ckpt
  use_msa: true
  msa_mask_scope: diff
  msa_mask_mode: substitute
  negative_msa_regime: matched
  wt_ceiling_control: global
  reuse_module3_rupture: true
  strict_msa: true
  diffusion_batch_size: 2             # 2 passe sans problème sur les 24 Go de VRAM de l'A30
  chunk_size: 40

energy:
  enabled: true
  # Python de l'environnement contenant PyRosetta
  python: /home/friend/miniforge3/envs/orthoppinterface/bin/python
  n_procs: 16                         # Nombre de cœurs CPU alloués au FastRelax PyRosetta
  pack_designs: true
  relax_repeats: 1
  seed: 1
  weight_iptm: 0.5
  min_binding_fraction: 0.5
  f_energy_min: -0.05

structural_constraints:
  interface_distance_threshold_angstroms: 6.0
  neighborhood_radius_angstroms: 6.0
  crop_chain_B_distance_angstroms: 15.0

thresholds:
  monomer_stability:
    plddt_min: 80.0
    rmsd_max: 3.0
    rmsd_framework_max: 1.5
  negative_design_rupture:
    iptm_rupture_max: 0.45
  positive_design_rescue:
    iptm_rescue_min: 0.70
    relative_to_ceiling: 0.80
  negative_design_orthogonality:
    iptm_negative_max: 0.65
  orthogonality:
    f_ortho_min: 0.02
  dockq_min: 0.23
  lrms_max: 15.0
  early_exit:
    rescue_iptm_floor: 0.25
    require_dockq: true
  fail_fast:
    # Débridage de l'entonnoir : autoriser jusqu'à 32 candidats A' d'élite
    max_passing_candidates: 32
