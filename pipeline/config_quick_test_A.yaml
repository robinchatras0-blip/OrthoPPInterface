pipeline:
  run_name: run_test_rmsd_A
  runs_dir: runs
  input_pdb: data/inputs/complex_S1_S2.pdb
  input_msa_A: data/inputs/S1_chain_A.a3m
  input_msa_B: data/inputs/S2_chain_B.a3m
  chain_A: A
  chain_B: B
  foundry_n_batches: 6
  foundry_diffusion_batch_size: 1
  rescue_diffusion_n_batches: 5
  rescue_ppi_hotspots: 8
  rupture_min_fixed_segment: 3
  rescue_min_fixed_segment: 3
  rescue_partial_t: null
  max_rescue_scaffolds: 4
  include_native_scaffold: true
  scaffold_max_clashes: 5
  scaffold_max_framework_rmsd: 1.5
  scaffold_min_flex_rmsd: 0.5
  scaffold_max_flex_rmsd: 4.5
  local_rfdiffusion: bash bin/rfd3
  local_ligandmpnn: bash bin/mpnn
diversity_selection:
  enabled: true
  max_a_prime_motifs: 6
ligandmpnn:
  checkpoint_path: /home/ommearo/.foundry/checkpoints/ligandmpnn_v_32_010_25.pt
  model_type: ligand_mpnn
  is_legacy_weights: 'True'
  temperature_rupture: 0.2
  temperature_rescue: 0.15
  rescue_coadaptation: true
  rupture_apo_design: true
  samples_per_scaffold: 30
  top_k_per_motif: 4
  max_clashes_with_a_prime: 3
folding:
  rf3_bin: /home/ommearo/miniforge3/envs/orthoppinterface/bin/rf3
  rf3_ckpt: /home/ommearo/.foundry/checkpoints/rf3_foundry_01_24_latest.ckpt
  use_msa: true
  msa_mask_scope: interface
  msa_mask_mode: gap
  negative_msa_regime: matched
  wt_ceiling_control: global
  reuse_module3_rupture: true
  strict_msa: true
  diffusion_batch_size: 2
energy:
  enabled: true
  python: /home/ommearo/miniforge3/envs/orthoppinterface/bin/python
  n_procs: 16
  pack_designs: true
  relax_repeats: 1
  seed: 1
  weight_iptm: 0.5
  min_binding_fraction: 0.5
  f_energy_min: 0.0
structural_constraints:
  interface_distance_threshold_angstroms: 6.0
  neighborhood_radius_angstroms: 6.0
  crop_chain_B_distance_angstroms: 15.0
thresholds:
  monomer_stability:
    plddt_min: 80.0
    rmsd_max: 3.0
    rmsd_framework_max: 1.5
  negative_design_rupture:
    iptm_rupture_max: 0.35
  positive_design_rescue:
    iptm_rescue_min: 0.75
    relative_to_ceiling: 0.85
  negative_design_orthogonality:
    iptm_negative_max: 0.35
  orthogonality:
    f_ortho_min: 0.30
  early_exit:
    rescue_iptm_floor: 0.30
  fail_fast:
    max_passing_candidates: 6
