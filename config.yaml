pipeline:
  run_name: run_production_100A_10B
  runs_dir: runs
  execution_mode: local
  python_bin: python
  input_pdb: data/inputs/complex_S1_S2.pdb
  input_msa_A: data/inputs/S1_chain_A.a3m
  input_msa_B: data/inputs/S2_chain_B.a3m
  input_msa: data/inputs/S1_chain_A.a3m
  chain_A: A
  chain_B: B
  foundry_n_batches: 100
  foundry_diffusion_batch_size: 1
  local_rfdiffusion: bash OrthoIntRob/bin/rfd3
  local_ligandmpnn: bash OrthoIntRob/bin/mpnn
  apptainer_rfdiffusion: containers/rfdiffusion.sif
  apptainer_ligandmpnn: containers/ligandmpnn.sif
  colab_rfdiffusion: rfd3
  colab_ligandmpnn: mpnn
diversity_selection:
  enabled: true
  max_a_prime_motifs: 10
ligandmpnn:
  checkpoint_path: OrthoIntRob/ligandmpnn/model_params/ligandmpnn_v_32_010_25.pt
  model_type: ligand_mpnn
  is_legacy_weights: 'True'
  pack_side_chains: 1
  temperature_rupture: 0.2
  temperature_rescue: 0.2
  rescue_coadaptation: true
  rescue_n_batches: 30
  samples_per_scaffold: 30
  top_k_per_scaffold: 2
folding:
  engine: af2
  colabfold_cmd: bash OrthoIntRob/bin/colabfold_batch
  colabfold_num_recycle: 3
  colabfold_model_type: alphafold2_multimer_v3
  colabfold_pair_mode: unpaired
  af3_cmd: alphafold3
structural_constraints:
  interface_distance_threshold_angstroms: 6.0
  neighborhood_radius_angstroms: 10.0
  crop_chain_B_distance_angstroms: 15.0
  max_hotspot_mutations: 3
thresholds:
  monomer_stability:
    plddt_min: 80.0
    rmsd_max: 2.0
  negative_design_rupture:
    iptm_rupture_max: 0.35
  positive_design_rescue:
    iptm_rescue_min: 0.75
slurm_defaults:
  partition: gpu
  cpus_per_task: 8
  mem_gb: 32
  gpu_type: a100
